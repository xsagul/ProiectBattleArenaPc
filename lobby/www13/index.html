<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>BattleArena</title>
<!-- The out-of-game client after League Client 13.3: the style sheets, fonts, pictures, videos, sounds and texts are
     the client's own files (lcu-data/13.3/plugins, served at the client's own addresses), the elements are those of
     its page layouts (research/lcu133/templates, read out of its plugins) and of its viewport host (the
     #rcp-fe-viewport-root rules in rcp-fe-lol-shared-components.css). What the page does is this project's code
     (uikit.js, client13.js); Riot's scripts are not run. -->
<link rel="stylesheet" href="/fe/lol-typekit/fonts/fonts.css">
<link rel="stylesheet" href="/fe/lol-typekit/fonts/styles.css">
<link rel="stylesheet" href="/fe/lol-uikit/main.css">
<link rel="stylesheet" href="/fe/lol-uikit/rcp-fe-lol-uikit.css">
<link rel="stylesheet" href="/fe/ember-libs/rcp-fe-ember-libs.css">
<link rel="stylesheet" href="/fe/lol-shared-components/rcp-fe-lol-shared-components.css">
<link rel="stylesheet" href="/fe/lol-navigation/rcp-fe-lol-navigation.css">
<link rel="stylesheet" href="/fe/lol-parties/rcp-fe-lol-parties.css">
<link rel="stylesheet" href="/fe/lol-social/rcp-fe-lol-social.css">
<link rel="stylesheet" href="/fe/lol-champ-select/rcp-fe-lol-champ-select.css">
<link rel="stylesheet" href="/client13.css">
</head>
<body data-locale="en-US">
<div id="rcp-fe-viewport-root">
  <section class="rcp-fe-viewport-main">
    <div class="screen-root active" data-screen-name="rcp-fe-lol-home-main"></div>
    <div class="screen-root hidden" data-screen-name="rcp-fe-lol-parties"></div>
  </section>
  <section class="rcp-fe-viewport-sidebar">
    <div class="screen-root active" data-screen-name="rcp-fe-lol-social"></div>
  </section>
  <section class="rcp-fe-viewport-overlay">
    <div class="screen-root" data-screen-name="rcp-fe-lol-navigation-screen"></div>
  </section>
  <section class="rcp-fe-viewport-persistent"></section>
  <section class="rcp-fe-viewport-full-screen">
    <div class="screen-root" data-screen-name="rcp-fe-lol-ready-check"></div>
    <div class="screen-root" data-screen-name="rcp-fe-lol-champ-select"></div>
  </section>
</div>
<script src="/uikit.js"></script>
<script src="/client13.js"></script>
<script src="/champselect13.js"></script>
</body>
</html>
